name: "E2E Security Tests"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  ALLOW_TEST_HELPERS: "1"
jobs:
  e2e-security:
    name: "Playwright Security Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_STATUS_SECRET: ${{ secrets.INTERNAL_STATUS_SECRET }}
          PAYMENT_PROVIDER: sandbox
          ALLOW_SANDBOX_IN_PROD: "1"
