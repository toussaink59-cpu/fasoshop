name: "E2E Security Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ALLOW_TEST_HELPERS: "1"

jobs:
  dependency-audit:
    name: "Audit des dependances (npm audit)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high/critical uniquement)
        run: npm audit --audit-level=high

  e2e-security:
    name: "Playwright Security Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run E2E security tests
        run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_STATUS_SECRET: ${{ secrets.INTERNAL_STATUS_SECRET }}
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
